<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">THE LONG-TERM VALUE</text>

  <!-- Headline -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">A SAFE CAMPUS</tspan>
    <tspan x="80" y="385">IS A</tspan>
    <tspan x="80" y="460" fill="#C9A84C">TRUSTED CAMPUS.</tspan>
  </text>

  <!-- Body Text -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">
    <tspan x="80" y="530">The institutions that invest in adaptable,</tspan>
    <tspan x="80" y="570">climate-resilient infrastructure today will</tspan>
    <tspan x="80" y="610">secure the enrollment and trust of</tspan>
    <tspan x="80" y="650">tomorrow's parents.</tspan>
  </text>

  <!-- Trust Building: Upward Stacking Blocks -->
  <g transform="translate(140, 730)" fill="none">

    <!-- Foundation Layer (widest) -->
    <rect x="20" y="320" width="720" height="50" rx="4" stroke="#C9A84C" stroke-width="2"/>
    <text x="380" y="352" font-family="'Courier New', 'SF Mono', monospace" font-size="14" fill="#C9A84C" text-anchor="middle" letter-spacing="2">CLIMATE-RESILIENT INFRASTRUCTURE</text>

    <!-- Layer 2: Safety -->
    <rect x="80" y="255" width="600" height="50" rx="4" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <text x="380" y="287" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CAMPUS SAFETY &amp; CONTINUITY</text>

    <!-- Layer 3: Confidence -->
    <rect x="140" y="190" width="480" height="50" rx="4" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="380" y="222" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PARENTAL CONFIDENCE</text>

    <!-- Layer 4: Enrollment -->
    <rect x="200" y="125" width="360" height="50" rx="4" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text x="380" y="157" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ENROLLMENT GROWTH</text>

    <!-- Layer 5: Brand (narrowest) -->
    <rect x="260" y="60" width="240" height="50" rx="4" stroke="#C9A84C" stroke-width="2"/>
    <text x="380" y="92" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="18" fill="#C9A84C" text-anchor="middle" letter-spacing="1">TRUSTED BRAND</text>

    <!-- Vertical connectors -->
    <line x1="380" y1="110" x2="380" y2="125" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="380" y1="175" x2="380" y2="190" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="380" y1="240" x2="380" y2="255" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="380" y1="305" x2="380" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Upward arrow on the right -->
    <line x1="770" y1="360" x2="770" y2="70" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
    <polygon points="770,70 764,82 776,82" fill="rgba(201,168,76,0.5)" stroke="none"/>
    <text x="785" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="11" fill="rgba(201,168,76,0.6)" letter-spacing="1" transform="rotate(90, 785, 220)">VALUE OVER TIME</text>
  </g>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">07 / 08</text>
</svg>
