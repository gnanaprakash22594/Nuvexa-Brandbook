<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">NUVEXA SOLUTION · AUDIT</text>

  <!-- Headline -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">THE CLIMATE</tspan>
    <tspan x="80" y="385">RESILIENCE</tspan>
    <tspan x="80" y="460" fill="#C9A84C">AUDIT.</tspan>
  </text>

  <!-- Body Text (4 lines, tightened) -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">
    <tspan x="80" y="530">Nuvexa assesses your campus against extreme</tspan>
    <tspan x="80" y="570">weather models. We evaluate structural</tspan>
    <tspan x="80" y="610">vulnerabilities, water management systems, and</tspan>
    <tspan x="80" y="650">transit safety protocols to keep your doors open.</tspan>
  </text>

  <!-- Audit Focus Areas Illustration -->
  <g transform="translate(100, 740)" fill="none">

    <!-- Central Infrastructure Axis -->
    <line x1="0" y1="160" x2="880" y2="160" stroke="#C9A84C" stroke-width="2"/>
    <line x1="0" y1="165" x2="880" y2="165" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>

    <!-- Axis Annotation -->
    <text x="440" y="200" font-family="'Courier New', 'SF Mono', monospace" font-size="10" fill="#C9A84C" letter-spacing="1" text-anchor="middle">CAMPUS RESILIENCE ASSESSMENT FRAMEWORK</text>

    <!-- Axis Nodes -->
    <circle cx="180" cy="160" r="4" fill="#C9A84C"/>
    <circle cx="440" cy="160" r="4" fill="#C9A84C"/>
    <circle cx="700" cy="160" r="4" fill="#C9A84C"/>

    <!-- Pod 1: Structural (Top) -->
    <g transform="translate(180, 65)">
      <line x1="0" y1="95" x2="0" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <circle cx="0" cy="40" r="3" fill="#FFFFFF"/>
      <rect x="-35" y="-35" width="70" height="70" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
      <polyline points="-12,-35 -8,-15 -15,5 -10,25 -12,35" stroke="#C9A84C" stroke-width="2" fill="none"/>
      <line x1="-45" y1="35" x2="45" y2="35" stroke="#C9A84C" stroke-width="2"/>
      <circle cx="22" cy="-12" r="10" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
      <line x1="29" y1="-5" x2="36" y2="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
      <text x="0" y="-50" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">STRUCTURAL</text>
    </g>

    <!-- Pod 2: Water Mgmt (Bottom) -->
    <g transform="translate(440, 255)">
      <!-- Connector split to avoid text overlap -->
      <line x1="0" y1="-95" x2="0" y2="-65" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <line x1="0" y1="-48" x2="0" y2="-40" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <circle cx="0" cy="-40" r="3" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="35" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" stroke="#C9A84C" stroke-width="2"/>
      <path d="M -25 -25 A 35 35 0 0 1 25 -25" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
      <path d="M 25 25 A 35 35 0 0 1 -25 25" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
      <polygon points="25,-25 20,-19 30,-19" fill="#C9A84C" stroke="none"/>
      <polygon points="-25,25 -20,19 -30,19" fill="#C9A84C" stroke="none"/>
      <text x="0" y="55" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">WATER MGMT</text>
    </g>

    <!-- Pod 3: Transit Safety (Top) -->
    <g transform="translate(700, 65)">
      <line x1="0" y1="95" x2="0" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <circle cx="0" cy="40" r="3" fill="#FFFFFF"/>
      <rect x="-35" y="-35" width="70" height="70" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="6 4"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="6 4"/>
      <circle cx="-16" cy="-16" r="7" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="-16" cy="-16" r="3" fill="#C9A84C"/>
      <circle cx="16" cy="16" r="7" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="3" fill="#C9A84C"/>
      <text x="0" y="-50" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TRANSIT SAFETY</text>
    </g>
  </g>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">05 / 08</text>
</svg>
