<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">THE VULNERABILITY</text>

  <!-- Headline (3 lines, 75px spacing) -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">THE</tspan>
    <tspan x="80" y="385">INFRASTRUCTURE</tspan>
    <tspan x="80" y="460" fill="#C9A84C">REALITY CHECK.</tspan>
  </text>

  <!-- Body Text (3 lines, 40px spacing) -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">
    <tspan x="80" y="530">The latest UDISE+ 2025-26 report shows</tspan>
    <tspan x="80" y="570">99.5% of schools have basic drinking water,</tspan>
    <tspan x="80" y="610">but true resilience is lagging.</tspan>
  </text>

  <!-- Section Header -->
  <text x="80" y="700" font-family="'Courier New', 'SF Mono', monospace" font-size="20" fill="#C9A84C" letter-spacing="3" font-weight="600">HIDDEN COSTS OF POOR PLANNING:</text>

  <!-- Card Row 1 (3 cards, 110px tall) -->
  <g transform="translate(80, 740)">
    <rect width="285" height="110" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="35" cy="55" r="5" fill="#C9A84C"/>
    <text x="60" y="45" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="20" fill="#FFFFFF">Waterlogged</text>
    <text x="60" y="72" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Campuses</text>
  </g>

  <g transform="translate(385, 740)">
    <rect width="285" height="110" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="35" cy="55" r="5" fill="#C9A84C"/>
    <text x="60" y="45" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="20" fill="#FFFFFF">Sinkholes &amp;</text>
    <text x="60" y="72" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Ground Collapse</text>
  </g>

  <g transform="translate(690, 740)">
    <rect width="285" height="110" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="35" cy="55" r="5" fill="#C9A84C"/>
    <text x="60" y="45" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="20" fill="#FFFFFF">Weakened</text>
    <text x="60" y="72" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Foundations</text>
  </g>

  <!-- Card Row 2 (3 cards, 110px tall) -->
  <g transform="translate(80, 870)">
    <rect width="285" height="110" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="35" cy="55" r="5" fill="#C9A84C"/>
    <text x="60" y="45" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="20" fill="#FFFFFF">Electrical</text>
    <text x="60" y="72" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Hazards</text>
  </g>

  <g transform="translate(385, 870)">
    <rect width="285" height="110" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="35" cy="55" r="5" fill="#C9A84C"/>
    <text x="60" y="45" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="20" fill="#FFFFFF">Mold &amp; Health</text>
    <text x="60" y="72" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Risks</text>
  </g>

  <g transform="translate(690, 870)">
    <rect width="285" height="110" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="35" cy="55" r="5" fill="#C9A84C"/>
    <text x="60" y="45" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="20" fill="#FFFFFF">Drainage</text>
    <text x="60" y="72" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Failures</text>
  </g>

  <!-- Nuvexa Insight Box -->
  <rect x="80" y="1030" width="920" height="145" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="120" y="1075" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" letter-spacing="2" font-weight="600">NUVEXA INSIGHT</text>
  <text x="120" y="1112" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="22" fill="#FFFFFF">Waterlogged campuses, sinkholes, and weakened foundations</text>
  <text x="120" y="1145" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="22" fill="#FFFFFF">are the hidden costs of poor planning.</text>


  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">02 / 08</text>
</svg>
