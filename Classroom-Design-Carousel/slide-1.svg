<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="logo.svg" x="690" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="200" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">CLASSROOM DESIGN SERIES</text>

  <!-- Main Headline -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="72" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="290">HOW DAYLIGHT</tspan>
    <tspan x="80" y="370">SHAPES THE WAY</tspan>
    <tspan x="80" y="450">STUDENTS</tspan>
    <tspan x="80" y="530" fill="#C9A84C">LEARN.</tspan>
  </text>

  <!-- Accent Line -->
  <rect x="80" y="560" width="80" height="5" rx="2" fill="#C9A84C"/>

  <!-- Subtitle -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.7)">
    <tspan x="80" y="620">The science behind classroom environments</tspan>
    <tspan x="80" y="660">that actually work.</tspan>
  </text>

  <!-- ILLUSTRATION: Classroom Cross-Section with Daylight -->
  <g transform="translate(140, 780)" fill="none">

    <!-- Subtle Background Circle -->
    <circle cx="400" cy="220" r="340" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

    <!-- Sun Element (Top Left) -->
    <g transform="translate(120, 30)">
      <circle cx="0" cy="0" r="35" stroke="#C9A84C" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="80" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
      <!-- Rays -->
      <line x1="35" y1="0" x2="70" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="70" cy="0" r="2" fill="#FFFFFF"/>
      <line x1="-35" y1="0" x2="-60" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="-60" cy="0" r="2" fill="#FFFFFF"/>
      <!-- Diagonal Rays -->
      <line x1="25" y1="25" x2="75" y2="75" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="75" cy="75" r="3" fill="#C9A84C"/>
      <line x1="25" y1="-25" x2="45" y2="-45" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="45" cy="-45" r="2" fill="#FFFFFF"/>
      <line x1="-25" y1="25" x2="-45" y2="45" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="-45" cy="45" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Daylight Rays entering classroom -->
    <g stroke="rgba(201,168,76,0.25)" stroke-width="1" stroke-dasharray="6 4">
      <line x1="195" y1="105" x2="380" y2="160"/>
      <line x1="195" y1="105" x2="500" y2="200"/>
      <line x1="195" y1="105" x2="620" y2="260"/>
    </g>

    <!-- Ground Line -->
    <line x1="0" y1="400" x2="800" y2="400" stroke="#C9A84C" stroke-width="2"/>
        <line x1="0" y1="410" x2="800" y2="410" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Building Outline - Classroom Cross Section -->
    <!-- Left Wall -->
    <line x1="200" y1="400" x2="200" y2="120" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <!-- Right Wall -->
    <line x1="700" y1="400" x2="700" y2="120" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <!-- Roof -->
    <line x1="180" y1="120" x2="720" y2="120" stroke="#C9A84C" stroke-width="2"/>
    <line x1="185" y1="112" x2="715" y2="112" stroke="rgba(201,168,76,0.4)" stroke-width="1"/>

    <!-- Recessed Window with Light Shelf -->
    <rect x="200" y="160" width="30" height="120" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Light Shelf -->
    <line x1="200" y1="220" x2="250" y2="220" stroke="#C9A84C" stroke-width="2"/>
    <circle cx="230" cy="220" r="3" fill="#C9A84C"/>

    <!-- Bounced Light Arrows (from light shelf to ceiling) -->
    <g stroke="rgba(201,168,76,0.5)" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="240" y1="220" x2="320" y2="130"/>
      <line x1="320" y1="130" x2="450" y2="180"/>
      <line x1="450" y1="180" x2="550" y2="140"/>
      <line x1="550" y1="140" x2="650" y2="200"/>
    </g>

    <!-- Interior Elements: Desks -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="1.5">
      <rect x="320" y="320" width="60" height="30" rx="3"/>
      <rect x="420" y="320" width="60" height="30" rx="3"/>
      <rect x="520" y="320" width="60" height="30" rx="3"/>
    </g>

    <!-- Board on Right Wall -->
    <rect x="680" y="180" width="20" height="100" stroke="#C9A84C" stroke-width="1.5"/>

    <!-- Foundation Nodes -->
    <circle cx="200" cy="400" r="3" fill="#C9A84C"/>
    <circle cx="700" cy="400" r="3" fill="#C9A84C"/>

    <!-- Ground Axis Ticks -->
    <line x1="350" y1="400" x2="350" y2="415" stroke="rgba(201,168,76,0.5)" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="550" y1="400" x2="550" y2="415" stroke="rgba(201,168,76,0.5)" stroke-width="1" stroke-dasharray="2 2"/>

  </g>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">01 / 08</text>
</svg>







