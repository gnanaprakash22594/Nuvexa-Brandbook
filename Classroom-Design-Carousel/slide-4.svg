<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="logo.svg" x="690" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">DESIGN PRINCIPLE 02</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">ORIENTATION</tspan>
    <tspan x="80" y="385">DECIDES COMFORT</tspan>
    <tspan x="80" y="460"><tspan fill="#C9A84C">BEFORE</tspan></tspan>
    <tspan x="80" y="535"><tspan fill="#C9A84C">CONSTRUCTION.</tspan></tspan>
  </text>

  <text x="80" y="620" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.7)" line-height="1.5">
    <tspan x="80" dy="0">A classroom facing the wrong direction receives</tspan>
    <tspan x="80" dy="42">direct solar radiation for hours. Proper building</tspan>
    <tspan x="80" dy="42">orientation reduces indoor temperatures by 3-5°C</tspan>
    <tspan x="80" dy="42">without mechanical cooling.</tspan>
  </text>

  <!-- Illustration: Building Orientation & Solar Path Blueprint -->
  <g transform="translate(540, 910)" fill="none">

    <!-- Solar Arc -->
    <path d="M -320 60 A 320 180 0 0 1 320 60" stroke="rgba(201,168,76,0.2)" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Sun positions along arc -->
    <!-- Morning Sun (East) -->
    <g transform="translate(-280, -80)">
      <circle cx="0" cy="0" r="14" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="20" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="0" y="38" font-family="'Courier New', monospace" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">MORNING</text>
    </g>

    <!-- Noon Sun (Top) -->
    <g transform="translate(0, -120)">
      <circle cx="0" cy="0" r="18" fill="rgba(201,168,76,0.1)" stroke="#C9A84C" stroke-width="2"/>
      <circle cx="0" cy="0" r="28" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="2 2"/>
      <!-- Rays -->
      <line x1="0" y1="18" x2="0" y2="35" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
      <line x1="-15" y1="10" x2="-25" y2="18" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
      <line x1="15" y1="10" x2="25" y2="18" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
      <text x="0" y="-40" font-family="'Courier New', monospace" font-size="10" fill="#C9A84C" text-anchor="middle" letter-spacing="1">NOON (PEAK)</text>
    </g>

    <!-- Afternoon Sun (West) -->
    <g transform="translate(280, -80)">
      <circle cx="0" cy="0" r="14" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="20" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="0" y="38" font-family="'Courier New', monospace" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">AFTERNOON</text>
    </g>

    <!-- Ground Line -->
    <line x1="-350" y1="60" x2="350" y2="60" stroke="#C9A84C" stroke-width="2"/>
    <line x1="-350" y1="65" x2="350" y2="65" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>

    <!-- Compass Rose -->
    <g transform="translate(0, 105)">
      <circle cx="0" cy="0" r="30" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#C9A84C"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="0" y="-38" font-family="'Inter', sans-serif" font-size="12" fill="#C9A84C" text-anchor="middle" font-weight="700">N</text>
      <text x="0" y="50" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">S</text>
      <text x="42" y="5" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">E</text>
      <text x="-42" y="5" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">W</text>
    </g>

    <!-- Building Plan (Top-Down, Oriented N-S) -->
    <g transform="translate(0, -20)">
      <!-- Main Building Rectangle -->
      <rect x="-80" y="-30" width="160" height="80" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <!-- Classroom divisions -->
      <line x1="-25" y1="-30" x2="-25" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="25" y1="-30" x2="25" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- North-facing windows (gold = good orientation) -->
      <line x1="-70" y1="-30" x2="70" y2="-30" stroke="#C9A84C" stroke-width="3"/>
      <!-- Shading devices on south face -->
      <g stroke="rgba(255,255,255,0.3)" stroke-width="1">
        <line x1="-60" y1="50" x2="-60" y2="60"/>
        <line x1="-30" y1="50" x2="-30" y2="60"/>
        <line x1="0" y1="50" x2="0" y2="60"/>
        <line x1="30" y1="50" x2="30" y2="60"/>
        <line x1="60" y1="50" x2="60" y2="60"/>
      </g>
    </g>

    <!-- Annotation Labels -->
    <g font-family="'Courier New', 'SF Mono', monospace" font-size="12" fill="#C9A84C" font-weight="600" letter-spacing="2">
      <!-- Optimal orientation -->
      <polyline points="-40,-30 -40,-80 -120,-80" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="-40" cy="-30" r="2.5" fill="#C9A84C"/>
      <text x="-130" y="-85" text-anchor="end">NORTH-FACING</text>
      <text x="-130" y="-71" text-anchor="end">FENESTRATION</text>

      <!-- Shading -->
      <line x1="75" y1="30" x2="120" y2="80" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="75" cy="30" r="2.5" fill="#C9A84C"/>
      <text x="130" y="78">SHADING</text>
      <text x="130" y="92">DEVICES</text>
    </g>
  </g>

  <!-- Why it matters Box -->
  <rect x="80" y="1080" width="920" height="150" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="120" y="1125" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="2" font-weight="600">WHY IT MATTERS</text>
  <text x="120" y="1165" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="24" fill="#FFFFFF">
    Orientation is a zero-cost decision at the design stage,
  </text>
  <text x="120" y="1195" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="22" fill="#FFFFFF">
    but an irreversible one after construction.
  </text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">04 / 08</text>
</svg>







