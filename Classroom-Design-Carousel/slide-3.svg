<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="logo.svg" x="690" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">DESIGN PRINCIPLE 01</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">CONTROL THE</tspan>
    <tspan x="80" y="385"><tspan fill="#C9A84C">LIGHT.</tspan></tspan>
    <tspan x="80" y="460">DON'T BLOCK IT.</tspan>
  </text>

  <text x="80" y="550" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.7)" line-height="1.5">
    <tspan x="80" dy="0">The goal isn't to eliminate daylight - it's to</tspan>
    <tspan x="80" dy="42">manage it. Recessed windows with light shelves</tspan>
    <tspan x="80" dy="42">redirect sunlight to the ceiling, bouncing diffused</tspan>
    <tspan x="80" dy="42">light deeper into the classroom.</tspan>
  </text>

  <!-- Illustration: Light Shelf Mechanism Blueprint -->
  <g transform="translate(140, 740)" fill="none">

    <!-- Engineering Grid -->
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
      <line x1="0" y1="0" x2="800" y2="0"/>
      <line x1="0" y1="50" x2="800" y2="50"/>
      <line x1="0" y1="100" x2="800" y2="100"/>
      <line x1="0" y1="150" x2="800" y2="150"/>
      <line x1="0" y1="200" x2="800" y2="200"/>
      <line x1="200" y1="-20" x2="200" y2="220"/>
      <line x1="400" y1="-20" x2="400" y2="220"/>
      <line x1="600" y1="-20" x2="600" y2="220"/>
    </g>

    <!-- Ground Line -->
    <line x1="-20" y1="200" x2="820" y2="200" stroke="#C9A84C" stroke-width="2"/>
    <line x1="-20" y1="205" x2="820" y2="205" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>

    <!-- Wall (Left) -->
    <line x1="100" y1="200" x2="100" y2="-20" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

    <!-- Ceiling -->
    <line x1="100" y1="-20" x2="750" y2="-20" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

    <!-- Floor extension -->
    <line x1="100" y1="200" x2="750" y2="200" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Window Opening (Recessed) -->
    <rect x="80" y="40" width="40" height="80" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Window recess depth -->
    <line x1="80" y1="40" x2="60" y2="30" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <line x1="80" y1="120" x2="60" y2="130" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

    <!-- Light Shelf (horizontal element in window) -->
    <line x1="80" y1="80" x2="160" y2="80" stroke="#C9A84C" stroke-width="3"/>
    <circle cx="120" cy="80" r="4" fill="#C9A84C"/>

    <!-- Sun rays hitting light shelf from outside -->
    <g stroke="rgba(201,168,76,0.4)" stroke-width="1.5">
      <line x1="20" y1="20" x2="100" y2="70"/>
      <line x1="10" y1="40" x2="100" y2="80"/>
      <line x1="0" y1="60" x2="100" y2="90"/>
    </g>

    <!-- Bounced light (from shelf to ceiling, then down into room) -->
    <g stroke="#C9A84C" stroke-width="1.5" stroke-dasharray="6 3">
      <!-- Up to ceiling -->
      <line x1="130" y1="80" x2="250" y2="-10"/>
      <!-- Across ceiling -->
      <line x1="250" y1="-10" x2="400" y2="10"/>
      <!-- Deeper bounce -->
      <line x1="400" y1="10" x2="550" y2="-5"/>
      <!-- Down into room -->
      <line x1="550" y1="-5" x2="650" y2="60"/>
    </g>

    <!-- Bounce nodes -->
    <circle cx="250" cy="-10" r="3" fill="#C9A84C"/>
    <circle cx="400" cy="10" r="3" fill="#FFFFFF"/>
    <circle cx="550" cy="-5" r="3" fill="#C9A84C"/>

    <!-- Direct light blocked below shelf -->
    <g stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3">
      <line x1="100" y1="90" x2="200" y2="150"/>
      <line x1="100" y1="100" x2="180" y2="170"/>
    </g>
    <!-- Block indicator -->
    <text x="160" y="185" font-family="'Courier New', monospace" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1">BLOCKED</text>

    <!-- Diffused light zone (gentle fill) -->
    <polygon points="160,80 250,-10 650,60 650,200 160,200" fill="rgba(201,168,76,0.03)" stroke="none"/>

    <!-- Annotation Labels -->
    <g font-family="'Courier New', 'SF Mono', monospace" font-size="12" fill="#C9A84C" font-weight="600" letter-spacing="2">
      <!-- Light Shelf label -->
      <line x1="120" y1="80" x2="120" y2="130" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <text x="130" y="138">LIGHT SHELF</text>

      <!-- Diffused light label -->
      <line x1="450" y1="40" x2="520" y2="40" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="450" cy="40" r="2.5" fill="#C9A84C"/>
      <text x="530" y="44">DIFFUSED DAYLIGHT</text>

      <!-- Recessed window label -->
      <line x1="70" y1="55" x2="30" y2="55" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <text x="20" y="50" text-anchor="end">RECESSED</text>
      <text x="20" y="65" text-anchor="end">WINDOW</text>
    </g>

    <!-- Foundation Nodes -->
    <circle cx="100" cy="200" r="3" fill="#C9A84C"/>
    <circle cx="400" cy="200" r="2" fill="#FFFFFF"/>
    <circle cx="750" cy="200" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Why it matters Box -->
  <rect x="80" y="1080" width="920" height="150" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="120" y="1125" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="2" font-weight="600">WHY IT MATTERS</text>
  <text x="120" y="1165" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="24" fill="#FFFFFF">
    Students in well-lit classrooms show up to 20% better
  </text>
  <text x="120" y="1195" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="24" fill="#FFFFFF">
    concentration and reduced eye strain.
  </text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">03 / 08</text>
</svg>








