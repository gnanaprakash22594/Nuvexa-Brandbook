    <text x="30" y="50" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="600" font-size="32" fill="#FFFFFF">04</text>
    <text x="30" y="100" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="22" fill="#C9A84C">Shaded Corridors</text>
    <g transform="translate(370, 25) scale(1.5)" stroke="#C9A84C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
