<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="logo.svg" x="690" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">DESIGN PRINCIPLE 04</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">GLARE-FREE</tspan>
    <tspan x="80" y="385">BOARDS CHANGE</tspan>
    <tspan x="80" y="460">HOW TEACHERS</tspan>
    <tspan x="80" y="535"><tspan fill="#C9A84C">TEACH.</tspan></tspan>
  </text>

  <text x="80" y="620" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.7)" line-height="1.5">
    <tspan x="80" dy="0">When students can't see the board clearly,</tspan>
    <tspan x="80" dy="42">learning breaks down. Anti-glare strategies make</tspan>
    <tspan x="80" dy="42">every seat in the classroom a good seat.</tspan>
  </text>

  <!-- Illustration: Classroom Glare Management Blueprint -->
  <g transform="translate(540, 880)" fill="none">

    <!-- Classroom cross-section view from side -->
    <!-- Floor -->
    <line x1="-350" y1="120" x2="350" y2="120" stroke="#C9A84C" stroke-width="2"/>
    <line x1="-350" y1="125" x2="350" y2="125" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>

    <!-- Back wall (with board) -->
    <line x1="280" y1="120" x2="280" y2="-100" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

    <!-- Ceiling -->
    <line x1="-300" y1="-100" x2="300" y2="-100" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

    <!-- Front wall with window -->
    <line x1="-300" y1="120" x2="-300" y2="-100" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <!-- Window opening -->
    <rect x="-320" y="-60" width="40" height="100" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

    <!-- Board on back wall -->
    <rect x="265" y="-50" width="15" height="90" rx="2" stroke="#C9A84C" stroke-width="2"/>
    <text x="295" y="0" font-family="'Courier New', monospace" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1" transform="rotate(90, 295, 0)">BOARD</text>

    <!-- Angled window / louvers (directing light up) -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1.5">
      <line x1="-300" y1="-50" x2="-270" y2="-60"/>
      <line x1="-300" y1="-30" x2="-270" y2="-40"/>
      <line x1="-300" y1="-10" x2="-270" y2="-20"/>
      <line x1="-300" y1="10" x2="-270" y2="0"/>
      <line x1="-300" y1="30" x2="-270" y2="20"/>
    </g>

    <!-- GLARE PATH (blocked - red-ish/dashed) -->
    <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="4 4">
      <!-- Direct sunlight path that would hit board -->
      <line x1="-320" y1="-20" x2="265" y2="-10"/>
    </g>
    <!-- X mark on glare path -->
    <g transform="translate(0, -15)" stroke="rgba(255,100,100,0.4)" stroke-width="2">
      <line x1="-8" y1="-8" x2="8" y2="8"/>
      <line x1="8" y1="-8" x2="-8" y2="8"/>
    </g>

    <!-- DIFFUSED LIGHT PATH (good - gold) -->
    <g stroke="rgba(201,168,76,0.5)" stroke-width="1.5" stroke-dasharray="5 3">
      <!-- Light redirected to ceiling -->
      <line x1="-270" y1="-40" x2="-100" y2="-95"/>
      <!-- Bounced across ceiling -->
      <line x1="-100" y1="-95" x2="100" y2="-90"/>
      <!-- Down into room evenly -->
      <line x1="100" y1="-90" x2="150" y2="20"/>
    </g>
    <circle cx="-100" cy="-95" r="3" fill="#C9A84C"/>
    <circle cx="100" cy="-90" r="3" fill="#FFFFFF"/>

    <!-- Student desks (3 rows) -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="1.5">
      <!-- Row 1 (near window) -->
      <rect x="-200" y="80" width="50" height="25" rx="3"/>
      <!-- Row 2 (middle) -->
      <rect x="-50" y="80" width="50" height="25" rx="3"/>
      <!-- Row 3 (near board) -->
      <rect x="100" y="80" width="50" height="25" rx="3"/>
    </g>

    <!-- Even light distribution indicators (arrows down to each desk) -->
    <g stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="3 3">
      <line x1="-175" y1="-85" x2="-175" y2="75"/>
      <line x1="-25" y1="-90" x2="-25" y2="75"/>
      <line x1="125" y1="-88" x2="125" y2="75"/>
    </g>
    <!-- Light level dots on desks -->
    <circle cx="-175" cy="75" r="3" fill="#C9A84C"/>
    <circle cx="-25" cy="75" r="3" fill="#C9A84C"/>
    <circle cx="125" cy="75" r="3" fill="#C9A84C"/>

    <!-- Annotation Labels -->
    <g font-family="'Courier New', 'SF Mono', monospace" font-size="12" fill="#C9A84C" font-weight="600" letter-spacing="2">
      <!-- Angled louvers -->
      <line x1="-260" y1="-70" x2="-200" y2="-70" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="-260" cy="-70" r="2.5" fill="#C9A84C"/>
      <rect x="-195" y="-76" width="125" height="14" fill="#0A1628"/>
      <text x="-190" y="-66">ANGLED LOUVERS</text>

      <!-- Glare blocked -->
      <rect x="15" y="-45" width="150" height="14" fill="#0A1628"/>
      <text x="20" y="-35" fill="rgba(255,100,100,0.5)" font-size="10">DIRECT GLARE BLOCKED</text>

      <!-- Even distribution -->
      <line x1="-25" y1="50" x2="50" y2="50" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <rect x="55" y="44" width="160" height="14" fill="#0A1628"/>
      <text x="60" y="54">EVEN DISTRIBUTION</text>

      <!-- Matte board -->
      <line x1="265" y1="60" x2="200" y2="60" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="265" cy="60" r="2.5" fill="#C9A84C"/>
      <rect x="75" y="54" width="115" height="14" fill="#0A1628"/>
      <text x="190" y="64" text-anchor="end">MATTE FINISH</text>
    </g>

  </g>

  <!-- Research Note Box -->
  <rect x="80" y="1080" width="920" height="150" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="120" y="1125" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="2" font-weight="600">WHY IT MATTERS</text>
  <text x="120" y="1165" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="24" fill="#FFFFFF">
    When every seat has equal visibility, engagement
  </text>
  <text x="120" y="1195" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="24" fill="#FFFFFF">
    becomes consistent across the entire classroom.
  </text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">06 / 08</text>
</svg>







