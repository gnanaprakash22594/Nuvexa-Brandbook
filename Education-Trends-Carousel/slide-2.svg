<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">TREND 01</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">AI-ENABLED</tspan>
    <tspan x="80" y="385" fill="#C9A84C">LEARNING SPACES</tspan>
  </text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">
    <tspan x="80" y="450">AI isn't replacing teachers.</tspan>
    <tspan x="80" y="485">It's changing how students learn.</tspan>
  </text>

  <text x="80" y="560" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="600" font-size="22" fill="#FFFFFF" letter-spacing="1">Future-ready classrooms need:</text>

  <!-- Item 1: Wi-Fi -->
  <g transform="translate(80, 600)">
    <rect width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <g transform="translate(35, 38)" fill="none" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round">
      <circle cx="0" cy="0" r="3" fill="#C9A84C" stroke="none"/>
      <path d="M -8 -7 A 12 12 0 0 1 8 -7"/>
      <path d="M -15 -14 A 22 22 0 0 1 15 -14"/>
      <path d="M -22 -21 A 32 32 0 0 1 22 -21"/>
    </g>
    <text x="90" y="30" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">Reliable Campus-Wide Wi-Fi</text>
    <text x="90" y="56" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="20" fill="rgba(255,255,255,0.55)">High-speed connectivity everywhere.</text>
  </g>

  <!-- Item 2: Interactive Displays -->
  <g transform="translate(80, 700)">
    <rect width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <g transform="translate(14, 14)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="34" height="24" rx="3"/>
      <line x1="21" y1="30" x2="21" y2="37"/>
      <line x1="13" y1="37" x2="29" y2="37"/>
      <!-- Touch indicator -->
      <circle cx="30" cy="14" r="4" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="30" cy="14" r="1.5" fill="#C9A84C" stroke="none"/>
    </g>
    <text x="90" y="30" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">Interactive Displays</text>
    <text x="90" y="56" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="20" fill="rgba(255,255,255,0.55)">Smart boards and touch screens.</text>
  </g>

  <!-- Item 3: AI Infrastructure -->
  <g transform="translate(80, 800)">
    <rect width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <g transform="translate(14, 14)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- CPU chip icon -->
      <rect x="10" y="10" width="22" height="22" rx="3"/>
      <rect x="16" y="16" width="10" height="10" rx="1"/>
      <!-- Pins -->
      <line x1="16" y1="10" x2="16" y2="5"/>
      <line x1="21" y1="10" x2="21" y2="5"/>
      <line x1="26" y1="10" x2="26" y2="5"/>
      <line x1="16" y1="32" x2="16" y2="37"/>
      <line x1="21" y1="32" x2="21" y2="37"/>
      <line x1="26" y1="32" x2="26" y2="37"/>
      <line x1="10" y1="16" x2="5" y2="16"/>
      <line x1="10" y1="21" x2="5" y2="21"/>
      <line x1="10" y1="26" x2="5" y2="26"/>
      <line x1="32" y1="16" x2="37" y2="16"/>
      <line x1="32" y1="21" x2="37" y2="21"/>
      <line x1="32" y1="26" x2="37" y2="26"/>
    </g>
    <text x="90" y="30" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">AI-Compatible Infrastructure</text>
    <text x="90" y="56" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="20" fill="rgba(255,255,255,0.55)">Networks built for AI-driven tools.</text>
  </g>

  <!-- Item 4: Flexible Layouts -->
  <g transform="translate(80, 900)">
    <rect width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <g transform="translate(14, 14)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Grid / layout icon -->
      <rect x="5" y="5" width="14" height="14" rx="2"/>
      <rect x="23" y="5" width="14" height="14" rx="2"/>
      <rect x="5" y="23" width="14" height="14" rx="2"/>
      <rect x="23" y="23" width="14" height="14" rx="2"/>
      <!-- Arrows indicating flexibility -->
      <path d="M 19 12 L 23 12" stroke-dasharray="2 1"/>
      <path d="M 12 19 L 12 23" stroke-dasharray="2 1"/>
    </g>
    <text x="90" y="30" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">Flexible Teaching Layouts</text>
    <text x="90" y="56" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="20" fill="rgba(255,255,255,0.55)">Adaptable spaces for varied pedagogy.</text>
  </g>

  <!-- Gold Accent Box -->
  <rect x="80" y="1030" width="920" height="90" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="540" y="1070" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" font-weight="600">AI STARTS WITH INFRASTRUCTURE,</text>
  <text x="540" y="1100" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" text-anchor="middle" letter-spacing="2" font-weight="600">NOT SOFTWARE.</text>

  <text x="80" y="1175" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="rgba(255,255,255,0.35)" letter-spacing="2">Source: UNESCO highlights AI as a major driver of future education.</text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">02 / 08</text>
</svg>
