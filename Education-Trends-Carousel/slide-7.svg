<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">TREND 06</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="72" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="315">SMART</tspan>
    <tspan x="80" y="395" fill="#C9A84C">CAMPUSES.</tspan>
  </text>

  <text x="80" y="455" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">Infrastructure is becoming connected.</text>

  <text x="80" y="520" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="600" font-size="22" fill="#FFFFFF" letter-spacing="1">Leading institutions are integrating:</text>

  <!-- 3x2 Icon Grid -->
  <!-- Card 1: Digital Visitor Management -->
  <g transform="translate(80, 560)">
    <rect width="290" height="160" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(125, 18)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- ID Badge -->
      <rect x="2" y="2" width="36" height="48" rx="4"/>
      <circle cx="20" cy="18" r="7"/>
      <path d="M 10 40 Q 20 32 30 40"/>
      <line x1="10" y1="46" x2="30" y2="46"/>
    </g>
    <text x="145" y="140" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">DIGITAL VISITOR MGMT</text>
  </g>

  <!-- Card 2: Smart Access Control -->
  <g transform="translate(395, 560)">
    <rect width="290" height="160" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(125, 18)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Padlock -->
      <rect x="6" y="22" width="28" height="24" rx="4"/>
      <path d="M 12 22 L 12 14 A 8 8 0 0 1 28 14 L 28 22"/>
      <circle cx="20" cy="34" r="3" fill="#C9A84C" stroke="none"/>
      <line x1="20" y1="37" x2="20" y2="42"/>
    </g>
    <text x="145" y="140" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">SMART ACCESS CONTROL</text>
  </g>

  <!-- Card 3: Asset Tracking -->
  <g transform="translate(710, 560)">
    <rect width="290" height="160" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(125, 15)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Map pin -->
      <path d="M 20 6 A 14 14 0 0 1 34 20 Q 34 30 20 48 Q 6 30 6 20 A 14 14 0 0 1 20 6"/>
      <circle cx="20" cy="20" r="5"/>
    </g>
    <text x="145" y="140" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">ASSET TRACKING</text>
  </g>

  <!-- Card 4: Energy Monitoring -->
  <g transform="translate(80, 745)">
    <rect width="290" height="160" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(125, 18)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lightning bolt -->
      <polygon points="22,2 10,26 18,26 14,48 32,20 22,20 28,2"/>
    </g>
    <text x="145" y="140" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">ENERGY MONITORING</text>
  </g>

  <!-- Card 5: Facility Management -->
  <g transform="translate(395, 745)">
    <rect width="290" height="160" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(120, 16)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Building icon -->
      <rect x="4" y="14" width="32" height="34" rx="2"/>
      <polygon points="4,14 20,4 36,14"/>
      <rect x="12" y="22" width="8" height="6" rx="1"/>
      <rect x="24" y="22" width="8" height="6" rx="1"/>
      <rect x="12" y="34" width="8" height="6" rx="1"/>
      <rect x="24" y="34" width="8" height="6" rx="1"/>
    </g>
    <text x="145" y="140" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">FACILITY MANAGEMENT</text>
  </g>

  <!-- Card 6: Campus Analytics -->
  <g transform="translate(710, 745)">
    <rect width="290" height="160" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(120, 16)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Bar chart -->
      <line x1="6" y1="48" x2="6" y2="6"/>
      <line x1="6" y1="48" x2="42" y2="48"/>
      <rect x="12" y="30" width="7" height="18" rx="1" fill="#C9A84C" opacity="0.25" stroke="none"/>
      <rect x="22" y="20" width="7" height="28" rx="1" fill="#C9A84C" opacity="0.35" stroke="none"/>
      <rect x="32" y="10" width="7" height="38" rx="1" fill="#C9A84C" opacity="0.5" stroke="none"/>
      <rect x="12" y="30" width="7" height="18" rx="1"/>
      <rect x="22" y="20" width="7" height="28" rx="1"/>
      <rect x="32" y="10" width="7" height="38" rx="1"/>
    </g>
    <text x="145" y="140" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">CAMPUS ANALYTICS</text>
  </g>

  <!-- Gold Accent Box -->
  <rect x="80" y="980" width="920" height="90" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="540" y="1020" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" font-weight="600">A SMARTER CAMPUS IMPROVES OPERATIONS</text>
  <text x="540" y="1050" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" text-anchor="middle" letter-spacing="2" font-weight="600">AS MUCH AS LEARNING.</text>

  <!-- Nuvexa Insight -->
  <g transform="translate(80, 1115)">
    <rect width="200" height="32" rx="6" fill="rgba(201,168,76,0.12)" stroke="#C9A84C" stroke-width="0.5"/>
    <text x="18" y="22" font-family="'Courier New', 'SF Mono', monospace" font-size="12" fill="#C9A84C" letter-spacing="2" font-weight="600">NUVEXA INSIGHT</text>
  </g>
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.45)">
    <tspan x="80" y="1180">Connected infrastructure reduces costs, improves safety,</tspan>
    <tspan x="80" y="1205">and delivers real-time campus intelligence.</tspan>
  </text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">07 / 08</text>
</svg>
