<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">TREND 03</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">MAKER SPACES</tspan>
    <tspan x="80" y="385">OVER <tspan fill="#C9A84C">MEMORIZATION.</tspan></tspan>
  </text>

  <text x="80" y="445" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">Students learn better by building.</text>

  <text x="80" y="510" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="600" font-size="22" fill="#FFFFFF" letter-spacing="1">Future campuses are investing in:</text>

  <!-- 2x2 Cards with arrows -->
  <!-- Card 1: Robotics Labs -->
  <g transform="translate(80, 550)">
    <rect width="440" height="160" rx="12" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <g transform="translate(35, 20)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Robot arm -->
      <rect x="12" y="30" width="20" height="8" rx="2"/>
      <line x1="22" y1="30" x2="22" y2="20"/>
      <line x1="22" y1="20" x2="36" y2="12"/>
      <circle cx="38" cy="10" r="5"/>
      <line x1="8" y1="38" x2="36" y2="38"/>
    </g>
    <text x="40" y="100" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">ROBOTICS LABS</text>
    <text x="40" y="130" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Hands-on automation and coding.</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="525" y1="630" x2="550" y2="630" stroke="#C9A84C" stroke-width="2"/>
  <polygon points="550,625 560,630 550,635" fill="#C9A84C"/>

  <!-- Card 2: Fabrication Workshops -->
  <g transform="translate(555, 550)">
    <rect width="440" height="160" rx="12" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <g transform="translate(35, 20)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Gear icon -->
      <circle cx="20" cy="20" r="10"/>
      <circle cx="20" cy="20" r="4"/>
      <!-- Gear teeth (simple) -->
      <line x1="20" y1="7" x2="20" y2="3"/>
      <line x1="20" y1="33" x2="20" y2="37"/>
      <line x1="7" y1="20" x2="3" y2="20"/>
      <line x1="33" y1="20" x2="37" y2="20"/>
      <line x1="11" y1="11" x2="8" y2="8"/>
      <line x1="29" y1="29" x2="32" y2="32"/>
      <line x1="11" y1="29" x2="8" y2="32"/>
      <line x1="29" y1="11" x2="32" y2="8"/>
    </g>
    <text x="40" y="100" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">FABRICATION WORKSHOPS</text>
    <text x="40" y="130" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">3D printing, laser cutting, CNC.</text>
  </g>

  <!-- Card 3: Innovation Studios -->
  <g transform="translate(80, 740)">
    <rect width="440" height="160" rx="12" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <g transform="translate(35, 20)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lightbulb -->
      <path d="M 14 24 Q 6 18 8 10 A 12 12 0 0 1 32 10 Q 34 18 26 24"/>
      <line x1="14" y1="24" x2="14" y2="30"/>
      <line x1="26" y1="24" x2="26" y2="30"/>
      <line x1="14" y1="30" x2="26" y2="30"/>
      <line x1="15" y1="34" x2="25" y2="34"/>
      <line x1="17" y1="37" x2="23" y2="37"/>
      <!-- Rays -->
      <line x1="20" y1="-2" x2="20" y2="-6"/>
      <line x1="8" y1="2" x2="5" y2="-1"/>
      <line x1="32" y1="2" x2="35" y2="-1"/>
    </g>
    <text x="40" y="100" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">INNOVATION STUDIOS</text>
    <text x="40" y="130" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Creative thinking meets technology.</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="525" y1="820" x2="550" y2="820" stroke="#C9A84C" stroke-width="2"/>
  <polygon points="550,815 560,820 550,825" fill="#C9A84C"/>

  <!-- Card 4: Prototyping Spaces -->
  <g transform="translate(555, 740)">
    <rect width="440" height="160" rx="12" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <g transform="translate(35, 20)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Blueprint / prototype icon -->
      <rect x="4" y="4" width="32" height="36" rx="3"/>
      <line x1="12" y1="14" x2="28" y2="14"/>
      <line x1="12" y1="21" x2="25" y2="21"/>
      <line x1="12" y1="28" x2="20" y2="28"/>
      <!-- Export arrow (outline only) -->
      <line x1="26" y1="32" x2="34" y2="32"/>
      <polyline points="30,28 34,32 30,36"/>
    </g>
    <text x="40" y="100" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">PROTOTYPING SPACES</text>
    <text x="40" y="130" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">From idea to working model, fast.</text>
  </g>

  <!-- Gold Accent Box -->
  <rect x="80" y="970" width="920" height="90" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="540" y="1010" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" font-weight="600">THE FOCUS IS SHIFTING FROM PASSIVE LEARNING</text>
  <text x="540" y="1040" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" text-anchor="middle" letter-spacing="2" font-weight="600">TO HANDS-ON PROBLEM SOLVING.</text>

  <!-- Nuvexa Insight -->
  <g transform="translate(80, 1110)">
    <rect width="200" height="32" rx="6" fill="rgba(201,168,76,0.12)" stroke="#C9A84C" stroke-width="0.5"/>
    <text x="18" y="22" font-family="'Courier New', 'SF Mono', monospace" font-size="12" fill="#C9A84C" letter-spacing="2" font-weight="600">NUVEXA INSIGHT</text>
  </g>
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.45)">
    <tspan x="80" y="1175">Maker spaces build skills that textbooks can't:</tspan>
    <tspan x="80" y="1200">critical thinking, creativity, and collaboration.</tspan>
  </text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">04 / 08</text>
</svg>
