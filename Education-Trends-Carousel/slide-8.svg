<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="goldGradBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#D4B85A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>


  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <!-- Tag Badge -->
  <g transform="translate(80, 190)">
    <rect width="380" height="42" rx="8" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <text x="25" y="28" font-family="'Courier New', 'SF Mono', monospace" font-size="15" fill="#C9A84C" letter-spacing="3" font-weight="600">ONE TEAM  ·  NOT 25+ VENDORS</text>
  </g>

  <!-- Main Headline -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="320">THE FUTURE ISN'T</tspan>
    <tspan x="80" y="395">ABOUT BIGGER</tspan>
    <tspan x="80" y="470">CAMPUSES. IT'S</tspan>
    <tspan x="80" y="545">ABOUT <tspan fill="#C9A84C">BETTER ONES.</tspan></tspan>
  </text>

  <!-- Body Text -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">
    <tspan x="80" y="615">The institutions that invest in adaptable,</tspan>
    <tspan x="80" y="655">technology-enabled and student-centric</tspan>
    <tspan x="80" y="695">infrastructure today will be better prepared</tspan>
    <tspan x="80" y="735">for tomorrow's learners.</tspan>
  </text>

  <!-- Service Icon Cards (3 columns) -->
  <!-- Card 1: Assessment & Advisory -->
  <g transform="translate(80, 790)">
    <rect width="290" height="145" rx="12" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <g transform="translate(125, 14)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Clipboard icon -->
      <rect x="4" y="6" width="32" height="40" rx="3"/>
      <rect x="14" y="3" width="12" height="6" rx="2"/>
      <line x1="13" y1="20" x2="27" y2="20"/>
      <line x1="13" y1="28" x2="27" y2="28"/>
      <line x1="13" y1="36" x2="22" y2="36"/>
    </g>
    <text x="145" y="100" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">ASSESSMENT</text>
    <text x="145" y="120" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">&amp; ADVISORY</text>
  </g>

  <!-- Card 2: Single-Point Accountability -->
  <g transform="translate(395, 790)">
    <rect width="290" height="145" rx="12" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <g transform="translate(125, 14)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Target / bullseye -->
      <circle cx="20" cy="24" r="16"/>
      <circle cx="20" cy="24" r="10"/>
      <circle cx="20" cy="24" r="4" fill="#C9A84C" stroke="none"/>
    </g>
    <text x="145" y="100" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">SINGLE-POINT</text>
    <text x="145" y="120" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">ACCOUNTABILITY</text>
  </g>

  <!-- Card 3: On-Time Delivery -->
  <g transform="translate(710, 790)">
    <rect width="290" height="145" rx="12" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <g transform="translate(125, 14)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Clock icon -->
      <circle cx="20" cy="24" r="16"/>
      <line x1="20" y1="14" x2="20" y2="24"/>
      <line x1="20" y1="24" x2="28" y2="28"/>
      <circle cx="20" cy="24" r="2" fill="#C9A84C" stroke="none"/>
    </g>
    <text x="145" y="100" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">ON-TIME</text>
    <text x="145" y="120" font-family="'Courier New', 'SF Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="1.5" font-weight="600" text-anchor="middle">DELIVERY</text>
  </g>

  <!-- CTA Button -->
  <rect x="80" y="990" width="920" height="80" rx="12" fill="url(#goldGradBtn)"/>
  <text x="540" y="1042" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="26" fill="#0D1B2A" text-anchor="middle" letter-spacing="1">LET'S GET YOUR CAMPUS READY. TOGETHER.</text>

  <!-- Footer Question -->
  <text x="540" y="1140" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="22" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-style="italic">Which of these trends is your institution already planning for?</text>


  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">08 / 08</text>
</svg>
