<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">TREND 02</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">HYBRID LEARNING</tspan>
    <tspan x="80" y="385">IS <tspan fill="#C9A84C">HERE TO STAY.</tspan></tspan>
  </text>

  <text x="80" y="445" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.7)">Learning no longer happens only inside four walls.</text>

  <!-- 2x2 Grid Cards -->
  <!-- Card 1: Lecture Capture -->
  <g transform="translate(80, 510)">
    <rect width="440" height="180" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(35, 28)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Camera body -->
      <rect x="0" y="8" width="38" height="28" rx="4"/>
      <!-- Lens -->
      <polygon points="38,14 54,6 54,38 38,30"/>
      <!-- Record dot -->
      <circle cx="12" cy="22" r="4" fill="#C9A84C" stroke="none" opacity="0.6"/>
    </g>
    <text x="40" y="115" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">LECTURE CAPTURE</text>
    <text x="40" y="145" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Record and stream sessions live.</text>
  </g>

  <!-- Card 2: Hybrid Classrooms -->
  <g transform="translate(555, 510)">
    <rect width="440" height="180" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(35, 25)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Monitor -->
      <rect x="0" y="5" width="30" height="22" rx="3"/>
      <line x1="15" y1="27" x2="15" y2="34"/>
      <line x1="6" y1="34" x2="24" y2="34"/>
      <!-- Person -->
      <circle cx="46" cy="12" r="6"/>
      <path d="M 37 34 Q 46 26 55 34"/>
    </g>
    <text x="40" y="115" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">HYBRID CLASSROOMS</text>
    <text x="40" y="145" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Physical and remote, seamlessly.</text>
  </g>

  <!-- Card 3: AV Systems -->
  <g transform="translate(80, 720)">
    <rect width="440" height="180" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(35, 25)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Speaker icon -->
      <rect x="0" y="10" width="14" height="18" rx="2"/>
      <polygon points="14,10 28,2 28,36 14,28"/>
      <!-- Sound waves -->
      <path d="M 33 12 A 8 8 0 0 1 33 26"/>
      <path d="M 38 6 A 15 15 0 0 1 38 32"/>
    </g>
    <text x="40" y="115" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">HIGH-QUALITY AV SYSTEMS</text>
    <text x="40" y="145" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Crystal-clear audio and video.</text>
  </g>

  <!-- Card 4: Digital Collaboration -->
  <g transform="translate(555, 720)">
    <rect width="440" height="180" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <g transform="translate(35, 25)" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Three connected nodes -->
      <circle cx="20" cy="8" r="7"/>
      <circle cx="6" cy="32" r="7"/>
      <circle cx="34" cy="32" r="7"/>
      <line x1="15" y1="14" x2="9" y2="26"/>
      <line x1="25" y1="14" x2="31" y2="26"/>
      <line x1="13" y1="32" x2="27" y2="32"/>
    </g>
    <text x="40" y="115" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#FFFFFF" letter-spacing="2" font-weight="600">DIGITAL COLLABORATION</text>
    <text x="40" y="145" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.55)">Spaces built for teamwork.</text>
  </g>

  <!-- Gold Accent Box -->
  <rect x="80" y="970" width="920" height="90" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="540" y="1010" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" font-weight="600">CAMPUSES NOW NEED SPACES THAT SUPPORT</text>
  <text x="540" y="1040" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" text-anchor="middle" letter-spacing="2" font-weight="600">BOTH PHYSICAL AND DIGITAL PARTICIPATION.</text>

  <!-- Nuvexa Insight -->
  <g transform="translate(80, 1110)">
    <rect width="200" height="32" rx="6" fill="rgba(201,168,76,0.12)" stroke="#C9A84C" stroke-width="0.5"/>
    <text x="18" y="22" font-family="'Courier New', 'SF Mono', monospace" font-size="12" fill="#C9A84C" letter-spacing="2" font-weight="600">NUVEXA INSIGHT</text>
  </g>
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.45)">
    <tspan x="80" y="1175">Institutions are increasingly designing environments</tspan>
    <tspan x="80" y="1200">that support both physical and digital participation.</tspan>
  </text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">03 / 08</text>
</svg>
