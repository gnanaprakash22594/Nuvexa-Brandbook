<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="220" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">LESSON 04</text>

  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="310">NATURE IMPROVES</tspan>
    <tspan x="80" y="385"><tspan fill="#C9A84C">LEARNING.</tspan></tspan>
  </text>

  <text x="80" y="480" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.7)" line-height="1.5">
    <tspan x="80" dy="0">Abundant daylight, fresh air, greenery, and outdoor</tspan>
    <tspan x="80" dy="42">spaces contribute to healthier, more focused, and</tspan>
    <tspan x="80" dy="42">more engaged students.</tspan>
  </text>

  <!-- Illustration: Biophilic Classroom Architecture Blueprint -->
  <g transform="translate(540, 800)" fill="none">
    
    <!-- Foundation / Ground -->
    <line x1="-300" y1="140" x2="300" y2="140" stroke="#C9A84C" stroke-width="1.5"/>
    <line x1="-300" y1="144" x2="300" y2="144" stroke="rgba(201,168,76,0.2)" stroke-width="1"/>
    
    <!-- Deck Platform -->
    <rect x="-140" y="125" width="280" height="15" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <!-- Pilings -->
    <line x1="-120" y1="140" x2="-120" y2="125" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="120" y1="140" x2="120" y2="125" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Biophilic Structural Column -->
    <!-- Central axis -->
    <line x1="0" y1="125" x2="0" y2="-75" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Outer profiles (Hyperbolic structure) -->
    <path d="M -25 125 C -25 50, -35 0, -110 -72" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
    <path d="M 25 125 C 25 50, 35 0, 110 -72" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
    
    <!-- Internal structural ribs -->
    <path d="M -12 125 C -12 50, -15 0, -60 -74" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M 12 125 C 12 50, 15 0, 60 -74" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- Horizontal structural bracing rings -->
    <line x1="-20" y1="60" x2="20" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="-48" y1="-40" x2="48" y2="-40" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Roof Canopy -->
    <!-- Upper line -->
    <path d="M -280 -60 Q 0 -100 280 -60" stroke="#C9A84C" stroke-width="1.5"/>
    <!-- Lower structural line -->
    <path d="M -280 -55 Q 0 -95 280 -55" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
    <!-- Canopy structural nodes -->
    <circle cx="0" cy="-75" r="2" fill="#C9A84C"/>
    <circle cx="-115" cy="-68" r="2" fill="#C9A84C"/>
    <circle cx="115" cy="-68" r="2" fill="#C9A84C"/>

    <!-- Sun Path and Daylighting -->
    <!-- Solar Arc -->
    <path d="M -220 0 A 220 220 0 0 1 220 0" stroke="rgba(201,168,76,0.15)" stroke-dasharray="2 4"/>
    <!-- Sun Position (approx 135 degrees) -->
    <!-- (cx, cy) on circle r=220: (-155.5, -155.5) -->
    <circle cx="-155.5" cy="-155.5" r="12" fill="rgba(201,168,76,0.05)" stroke="#C9A84C" stroke-width="1"/>
    <circle cx="-155.5" cy="-155.5" r="18" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Daylighting Cone (Sunbeam entering space) -->
    <!-- from sun down to floor -->
    <polygon points="-145,-145 -10,125 110,125" fill="rgba(255,255,255,0.02)" stroke="none"/>
    <line x1="-145" y1="-145" x2="-10" y2="125" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="5 5"/>
    <line x1="-145" y1="-145" x2="110" y2="125" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Aerodynamic Cross Ventilation -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none">
      <!-- Main flow -->
      <path d="M -260 60 C -120 60, -80 -10, 0 -10 S 120 -30, 240 -40"/>
      <polygon points="240,-40 232,-43 234,-37" fill="rgba(255,255,255,0.4)" stroke="none"/>
      <!-- Secondary flow (lighter) -->
      <path d="M -260 80 C -120 80, -80 10, 0 10 S 120 -10, 240 -20" stroke="rgba(255,255,255,0.15)"/>
      <polygon points="240,-20 232,-23 234,-17" fill="rgba(255,255,255,0.15)" stroke="none"/>
    </g>

    <!-- Minimalist Architectural Trees (Top-down/Elevation abstraction) -->
    <g stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none">
      <!-- Tree 1 (Left) -->
      <circle cx="-180" cy="80" r="30"/>
      <circle cx="-180" cy="80" r="10"/>
      <circle cx="-180" cy="80" r="1.5" fill="rgba(255,255,255,0.5)"/>
      <line x1="-210" y1="80" x2="-150" y2="80"/>
      <line x1="-180" y1="50" x2="-180" y2="110"/>
      
      <!-- Tree 2 (Right) -->
      <circle cx="180" cy="60" r="40"/>
      <circle cx="180" cy="60" r="15"/>
      <circle cx="180" cy="60" r="1.5" fill="rgba(255,255,255,0.5)"/>
      <line x1="140" y1="60" x2="220" y2="60"/>
      <line x1="180" y1="20" x2="180" y2="100"/>
    </g>

    <!-- Architectural Annotations -->
    <g font-family="'Courier New', 'SF Mono', monospace" font-size="11" fill="#FFFFFF" letter-spacing="1">
      
      <!-- Biophilic Column -->
      <line x1="-15" y1="-10" x2="-140" y2="-10" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="-15" cy="-10" r="2.5" fill="#C9A84C"/>
      <text x="-150" y="-6" text-anchor="end">BIOPHILIC COLUMN</text>

      <!-- Optimized Daylighting -->
      <line x1="-175" y1="-155" x2="-280" y2="-155" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <text x="-290" y="-151" text-anchor="end">OPTIMIZED DAYLIGHTING</text>

      <!-- Cross Ventilation -->
      <line x1="80" y1="-17" x2="200" y2="-17" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="80" cy="-17" r="2.5" fill="#C9A84C"/>
      <text x="210" y="-13" text-anchor="start">CROSS VENTILATION</text>

      <!-- Integrated Greenery -->
      <line x1="180" y1="30" x2="250" y2="30" stroke="rgba(201,168,76,0.6)" stroke-width="1"/>
      <circle cx="180" cy="30" r="2.5" fill="#C9A84C"/>
      <text x="260" y="34" text-anchor="start">INTEGRATED GREENERY</text>
    </g>

  </g>

  <!-- Research Note Box -->
  <rect x="80" y="1000" width="920" height="130" rx="8" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="1"/>
  <text x="120" y="1055" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="24" fill="#FFFFFF">
    Research consistently shows that well-designed environments
  </text>
  <text x="120" y="1095" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="24" fill="#FFFFFF">
    positively influence student well-being and academic performance.
  </text>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">06 / 08</text>
</svg>
