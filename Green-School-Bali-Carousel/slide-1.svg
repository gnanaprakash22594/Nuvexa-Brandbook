<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="nuvexa-logo.png" x="700" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="200" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">CAMPUS SPOTLIGHT #01</text>

  <!-- Main Headline -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="72" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="290">5 INFRASTRUCTURE</tspan>
    <tspan x="80" y="370">LESSONS EVERY</tspan>
    <tspan x="80" y="450">SCHOOL CAN LEARN</tspan>
    <tspan x="80" y="530">FROM </tspan><tspan fill="#C9A84C">GREEN SCHOOL</tspan>
    <tspan x="80" y="610" fill="#C9A84C">BALI.</tspan>
  </text>

  <!-- Accent Line -->
  <rect x="80" y="640" width="80" height="5" rx="2" fill="#C9A84C"/>

  <!-- Subtitle -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.7)">
    <tspan x="80" y="700">Designing campuses that inspire curiosity,</tspan>
    <tspan x="80" y="740">creativity, and lifelong learning.</tspan>
  </text>

  <!-- ILLUSTRATION: Masterpiece Sustainable Campus Architecture (Green School Bali Inspired) -->
  <!-- ILLUSTRATION: Clean Minimalist Sustainable Campus -->
  <g transform="translate(140, 850)" fill="none">
    
    <!-- Abstract Background & Wind -->
    <circle cx="400" cy="250" r="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <!-- Subtle Wind Waves -->
    <path d="M 0 160 C 200 140, 300 100, 450 140 S 700 100, 800 140" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="10 6"/>
    <path d="M -20 200 C 150 160, 250 160, 450 210 S 650 160, 820 180" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="6 4"/>
    <path d="M 40 240 C 200 240, 300 180, 500 240 S 700 220, 850 200" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Base / Ground Layers -->
    <line x1="0" y1="360" x2="800" y2="360" stroke="#C9A84C" stroke-width="2"/>
    <line x1="0" y1="365" x2="800" y2="365" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="0" y1="370" x2="800" y2="370" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Ground Axis / Ticks -->
    <line x1="400" y1="360" x2="400" y2="400" stroke="#C9A84C" stroke-width="1.5"/>
    <line x1="160" y1="360" x2="160" y2="380" stroke="rgba(201,168,76,0.5)" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="640" y1="360" x2="640" y2="380" stroke="rgba(201,168,76,0.5)" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Left Element: Geometric Tree -->
    <g transform="translate(140, 260)">
      <line x1="0" y1="0" x2="0" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <polygon points="0,100 -40,30 40,30" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <polygon points="0,80 -30,10 30,10" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <polygon points="0,60 -20,-10 20,-10" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="0" cy="95" r="4" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="0" cy="95" r="2" fill="#C9A84C"/>
    </g>

    <!-- Right Element: Geometric Wheel -->
    <g transform="translate(640, 200)">
      <line x1="0" y1="0" x2="0" y2="160" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <!-- Small box base -->
      <rect x="-25" y="100" width="50" height="60" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <circle cx="0" cy="30" r="30" stroke="#C9A84C" stroke-width="2"/>
      <circle cx="0" cy="30" r="20" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="0" cy="30" r="3" fill="#C9A84C"/>
      <!-- Spokes -->
      <line x1="-30" y1="30" x2="30" y2="30" stroke="#C9A84C" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#C9A84C" stroke-width="1.5"/>
      <line x1="-21" y1="9" x2="21" y2="51" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="-21" y1="51" x2="21" y2="9" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    </g>

    <!-- Sun Element (Top Left) -->
    <g transform="translate(200, 60)">
      <circle cx="0" cy="0" r="35" stroke="#C9A84C" stroke-width="2.5"/>
      <!-- Concentric Axis Rings -->
      <circle cx="0" cy="0" r="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="80" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
      <!-- Axis Lines -->
      <line x1="0" y1="-80" x2="0" y2="-90" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="0" y1="80" x2="0" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <!-- Rays -->
      <line x1="35" y1="0" x2="70" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="70" cy="0" r="2" fill="#FFFFFF"/>
      <line x1="-35" y1="0" x2="-60" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="-60" cy="0" r="2" fill="#FFFFFF"/>
      <!-- Diagonal Rays -->
      <line x1="25" y1="25" x2="75" y2="75" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="75" cy="75" r="3" fill="#C9A84C"/>
      <line x1="-25" y1="25" x2="-45" y2="45" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="-45" cy="45" r="2" fill="#FFFFFF"/>
      <line x1="25" y1="-25" x2="45" y2="-45" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="45" cy="-45" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Main Central Arch Building -->
    <g transform="translate(400, 0)">
      <!-- Main Thick Arch -->
      <path d="M -240 360 C -180 150, -100 0, 0 -60 C 100 0, 180 150, 240 360" stroke="#C9A84C" stroke-width="3"/>
      <!-- Top Spire/Antenna -->
      <line x1="0" y1="-60" x2="0" y2="-80" stroke="#C9A84C" stroke-width="1.5"/>
      <circle cx="0" cy="-80" r="2" fill="#FFFFFF"/>
      <line x1="0" y1="-80" x2="-25" y2="-100" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="0" y1="-80" x2="25" y2="-100" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

      <!-- Inner Concentric Arches -->
      <path d="M -210 360 C -160 170, -80 30, 0 -30 C 80 30, 160 170, 210 360" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M -180 360 C -140 190, -60 60, 0 10 C 60 60, 140 190, 180 360" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <path d="M -150 360 C -120 210, -50 90, 0 50 C 50 90, 120 210, 150 360" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

      <!-- Internal Structural Grid / Scaffolding -->
      <line x1="0" y1="-60" x2="0" y2="360" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="-150" y1="280" x2="150" y2="280" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <!-- Diagonal bracing -->

      <!-- Entrance / Inner Box -->
      <rect x="-40" y="270" width="80" height="90" stroke="#C9A84C" stroke-width="1.5"/>
      <path d="M -40 270 Q 0 240 40 270" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <line x1="0" y1="255" x2="0" y2="360" stroke="#C9A84C" stroke-width="1.5"/>
      
      <!-- Nodes / Intersection Accents -->
      <circle cx="-165" cy="110" r="3" fill="#FFFFFF"/>
      <circle cx="45" cy="130" r="3" fill="#C9A84C"/>
      <circle cx="-135" cy="165" r="2" fill="#FFFFFF"/>
      
      <circle cx="0" cy="265" r="3" fill="#C9A84C"/>
      
      <circle cx="170" cy="360" r="2" fill="#FFFFFF"/>
      <circle cx="-170" cy="360" r="2" fill="#FFFFFF"/>
    </g>

  </g>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">01 / 08</text>
</svg>
