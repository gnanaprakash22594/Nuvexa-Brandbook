<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2035"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <image href="logo.svg" x="690" y="45" width="310" height="85" preserveAspectRatio="xMaxYMid meet"/>

  <!-- CONTENT -->
  <text x="80" y="230" font-family="'Courier New', 'SF Mono', monospace" font-size="18" fill="#C9A84C" letter-spacing="5" font-weight="600">FINAL TAKEAWAY</text>

  <!-- Main Headline -->
  <text x="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="72" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="80" y="320">THE SAFEST</tspan>
    <tspan x="80" y="400">SCHOOLS ARE</tspan>
    <tspan x="80" y="480">PLANNED BEFORE</tspan>
    <tspan x="80" y="560">AN <tspan fill="#C9A84C">EMERGENCY</tspan></tspan>
    <tspan x="80" y="640" fill="#C9A84C">EVER HAPPENS.</tspan>
  </text>

  <!-- Accent Line -->
  <rect x="80" y="670" width="80" height="5" rx="2" fill="#C9A84C"/>

  <text x="80" y="730" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.7)" line-height="1.5">
    <tspan x="80" dy="0">Safety is not an add-on or an afterthought.</tspan>
    <tspan x="80" dy="42">It should be part of every campus blueprint.</tspan>
  </text>

  <!-- Call to Action Box -->
  <g transform="translate(80, 910)">
    <rect width="920" height="240" rx="12" fill="rgba(201,168,76,0.05)" stroke="#C9A84C" stroke-width="1.5"/>
    <text x="60" y="70" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="#FFFFFF">
      At <tspan font-weight="700">NUVEXA</tspan>, we help institutions design campuses that
    </text>
    <text x="60" y="115" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="#FFFFFF">
      are inherently safe, fully compliant, and built to
    </text>
    <text x="60" y="160" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="300" font-size="26" fill="#FFFFFF">
      protect every student and educator.
    </text>
    <text x="60" y="215" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" letter-spacing="3" font-weight="600">CAMPUS TRANSFORMATION PARTNERS</text>
  </g>

  <!-- FOOTER -->
  <line x1="70" y1="1245" x2="1010" y2="1245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="70" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">NUVEXA  |  CAMPUS TRANSFORMATION PARTNERS</text>
  <text x="1010" y="1300" font-family="'Courier New', 'SF Mono', monospace" font-size="16" fill="#C9A84C" text-anchor="end" letter-spacing="2">07 / 07</text>
</svg>







